syntax = "proto3";

package nexus;
option go_package = "github.com/yfyadmin/go-agent-collect/proto/gen;nexuspb";

// ============================================================
// Nexus-Edge <-> Nexus-Controller gRPC Service
// ============================================================

service NexusService {
    // Bidirectional stream for heartbeat, strategy push, and data reporting
    rpc Connect(stream EdgeMessage) returns (stream ControllerMessage);
}

// ============================================================
// Edge -> Controller Messages
// ============================================================

message EdgeMessage {
    string node_id = 1;
    string auth_token = 2;

    oneof payload {
        Heartbeat heartbeat = 10;
        MetricsReport metrics = 11;
        LogReport logs = 12;
        StrategyAck strategy_ack = 13;
    }
}

message Heartbeat {
    int64 timestamp_unix = 1;
    string version = 2;
    double cpu_usage = 3;
    double mem_usage = 4;
    int64 total_requests = 5;
    int64 blocked_requests = 6;
    double current_qps = 7;
    int64 strategy_version = 8;
}

message MetricsReport {
    int64 timestamp_unix = 1;
    repeated MetricPoint points = 2;
}

message MetricPoint {
    string name = 1;       // cpu, mem, disk_read, disk_write, net_in, net_out, disk_usage
    double value = 2;
    int64 timestamp_unix = 3;
}

message LogReport {
    int64 timestamp_unix = 1;
    repeated LogEntry entries = 2;
}

message LogEntry {
    string file_path = 1;
    string content = 2;
    int64 line_number = 3;
    int64 timestamp_unix = 4;
}

message StrategyAck {
    int64 strategy_version = 1;
    bool success = 2;
    string error_message = 3;
}

// ============================================================
// Controller -> Edge Messages
// ============================================================

message ControllerMessage {
    oneof payload {
        StrategyUpdate strategy_update = 10;
        HeartbeatAck heartbeat_ack = 11;
        Backpressure backpressure = 12;
    }
}

message StrategyUpdate {
    int64 version = 1;
    int64 global_max_qps = 2;
    map<string, int64> url_rules = 3;
    repeated string ip_whitelist = 4;
    repeated HeaderRule header_whitelist = 5;
    double overload_cpu_threshold = 6;
    double overload_mem_threshold = 7;
    string algorithm = 8;
    double token_bucket_rate = 9;
    double token_bucket_burst = 10;
    int64 window_size_ms = 11;
    int64 window_max_requests = 12;
    int64 max_concurrency = 13;
    int64 blocked_status_code = 14;
    string blocked_response = 15;
}

message HeaderRule {
    string key = 1;
    string value = 2;
}

message HeartbeatAck {
    int64 server_timestamp = 1;
}

message Backpressure {
    int64 max_resend_rate = 1;  // max messages per second for resend
}
